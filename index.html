<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>❤BB背单词❤</title>
<style>
:root {
  --bg1:#eef2ff; --bg2:#f8fafc; --card:#ffffff; --text:#172033; --muted:#667085;
  --accent:#2563eb; --accent2:#1d4ed8; --line:#e5e7eb; --chip:#eff6ff; --warn:#f59e0b;
  --good:#16a34a; --danger:#dc2626; --shadow:0 14px 34px rgba(15,23,42,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Noto Sans SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--text)}
a{color:var(--accent);text-decoration:none}
.container{width:min(1180px,100%);margin:0 auto;padding:0 clamp(14px,3vw,24px)}
header{padding:30px 0 12px}
h1{margin:0 0 8px;font-size:clamp(26px,4.6vw,46px);line-height:1.12}
.sub{color:var(--muted);line-height:1.7;font-size:clamp(14px,2vw,16px)}
.panel{background:rgba(255,255,255,.82);border:1px solid rgba(229,231,235,.92);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(8px);padding:16px;margin:14px 0}
.controls-grid{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:12px;align-items:end}
.tool-grid{display:grid;grid-template-columns:minmax(220px,1.4fr) minmax(130px,.7fr) minmax(150px,.7fr) auto auto auto;gap:10px;align-items:end}
.review-grid,.import-grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;align-items:end}
.import-grid{grid-template-columns:minmax(240px,1fr) auto auto}
.field{display:flex;flex-direction:column;gap:6px}
label{font-weight:800;font-size:13px;color:#344054}
input,select,button{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;background:#fff;color:var(--text);min-height:46px}
button{cursor:pointer;background:var(--accent);color:#fff;border-color:var(--accent);font-weight:800;white-space:nowrap;transition:transform .12s ease,background .12s ease}
button:hover{background:var(--accent2)}
button:active{transform:translateY(1px)}
button.secondary{background:#fff;color:var(--accent)}
button.secondary:hover{background:#eff6ff}
button.danger{color:var(--danger);border-color:#fecaca}
button.danger:hover{background:#fff1f2}
.note{margin-top:10px;color:var(--muted);font-size:14px;line-height:1.65}
.kbd{display:inline-block;border:1px solid var(--line);border-radius:8px;background:#f8fafc;padding:1px 6px;font-size:12px;color:#475467}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.badge{display:inline-flex;align-items:center;gap:4px;border:1px solid #dbeafe;background:#eff6ff;color:#1e3a8a;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:800}
.badge.green{border-color:#bbf7d0;background:#f0fdf4;color:#166534}
.badge.orange{border-color:#fed7aa;background:#fff7ed;color:#9a3412}
.import-status{margin-top:10px;color:#166534;font-weight:700}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:16px 0 36px}
.card{position:relative;min-height:360px;perspective:1200px;outline:none}
.card.hidden{display:none}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .42s ease}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;overflow:hidden}
.front{justify-content:space-between}
.back{transform:rotateY(180deg);overflow:auto}
.card.unfamiliar .face{border-color:#fbbf24;box-shadow:0 16px 34px rgba(245,158,11,.18)}
.review-toggle{position:absolute;right:14px;top:14px;width:auto;min-height:34px;padding:6px 10px;border-radius:999px;background:#fffbeb;color:#92400e;border-color:#fde68a;font-size:12px;z-index:5}
.review-toggle:hover{background:#fef3c7}
.meta{display:flex;flex-wrap:wrap;gap:7px;padding-right:96px;color:#475467;font-weight:800;font-size:12px}
.meta span{background:#f2f4f7;border-radius:999px;padding:5px 8px}
.meta .unit{background:#ecfeff;color:#155e75}
.word{font-size:clamp(34px,7.5vw,56px);font-weight:950;letter-spacing:-1.5px;line-height:1.05;word-break:break-word}
.smallword{font-size:28px;font-weight:950;line-height:1.1;margin:12px 0 10px;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:var(--chip);color:#1e40af;border-radius:999px;padding:7px 10px;font-weight:800;font-size:13px}
.chips span.important{background:#fff7ed;color:#9a3412}
.label{font-size:12px;color:var(--muted);font-weight:900;margin-top:12px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.meaning{font-size:20px;font-weight:900;line-height:1.4}
.forms{line-height:1.65;color:#344054}
.forms div{margin:3px 0}
.dict,.hint{margin-top:12px;color:var(--muted);font-size:13px}
.empty,.loading{grid-column:1/-1;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:22px;padding:28px;color:var(--muted)}
.hidden{display:none!important}
@media (max-width: 980px){
  .controls-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tool-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .review-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width: 680px){
  header{padding-top:22px}
  .panel{border-radius:20px;padding:14px}
  .controls-grid,.tool-grid,.review-grid,.import-grid{grid-template-columns:1fr}
  #cards{grid-template-columns:1fr;gap:14px;padding-bottom:26px}
  .card{min-height:360px}
  .word{font-size:42px}
  .meta{padding-right:0;margin-top:34px}
  .review-toggle{right:12px;top:12px}
  input,select,button{font-size:16px}
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>BB背单词！❤</h1>
    <div class="sub">共 <b id="totalCount">570</b> 张卡片。</div>
  </header>

  <section class="panel" aria-label="学习会话设置">
    <div class="controls-grid">
      <div class="field">
        <label for="orderMode">排序依据</label>
        <select id="orderMode">
          <option value="importance">按单元重要性</option>
          <option value="alphabetical">按字母顺序</option>
        </select>
      </div>
      <div class="field">
        <label for="unitFilter">学习范围</label>
        <select id="unitFilter">
          <option value="all">全部 570 词</option>
          <option value="1">Sublist 1：最高频</option>
          <option value="2">Sublist 2</option>
          <option value="3">Sublist 3</option>
          <option value="4">Sublist 4</option>
          <option value="5">Sublist 5</option>
          <option value="6">Sublist 6</option>
          <option value="7">Sublist 7</option>
          <option value="8">Sublist 8</option>
          <option value="9">Sublist 9</option>
          <option value="10">Sublist 10：较低频</option>
          <option value="imported">导入卡片</option>
        </select>
      </div>
      <div class="field">
        <label for="mode">生成方式</label>
        <select id="mode">
          <option value="sequential">顺序生成</option>
          <option value="random">乱序生成</option>
        </select>
      </div>
      <div class="field">
        <label for="frontMode">正面显示</label>
        <select id="frontMode">
          <option value="pdf">PDF 高频词形</option>
          <option value="headword">AWL 词族核心词</option>
        </select>
      </div>
      <div class="field">
        <label for="amount">本次学习数量 n</label>
        <input id="amount" type="number" min="1" max="570" value="570" inputmode="numeric">
      </div>
      <div class="field">
        <label for="startIndex">顺序起点</label>
        <input id="startIndex" type="number" min="1" max="570" value="1" inputmode="numeric">
      </div>
      <button id="generate">生成本次卡片</button>
      <button id="generateAll" class="secondary">生成当前范围全部</button>
    </div>
    <div class="note">“按单元重要性”会优先学习 Sublist 1，再到 Sublist 10；每个单元内部按照 PDF 页面中的词表顺序。顺序起点按当前排序后的列表计算；乱序模式会在当前学习范围内随机抽取 n 张。</div>
  </section>

  <section class="panel" aria-label="筛选和导出">
    <div class="tool-grid">
      <div class="field search">
        <label for="q">搜索当前学习卡片</label>
        <input id="q" placeholder="搜索单词 / 中文意思 / PDF 词形 / Sublist，例如 analysis / 分析 / S1">
      </div>
      <div class="field">
        <label for="letter">首字母</label>
        <select id="letter"><option value="">全部首字母</option></select>
      </div>
      <div class="field">
        <label for="reviewFilter">熟悉程度</label>
        <select id="reviewFilter">
          <option value="all">全部</option>
          <option value="unfamiliar">只看不熟悉</option>
          <option value="familiar">隐藏不熟悉</option>
        </select>
      </div>
      <button id="flipAll" class="secondary">翻开全部</button>
      <button id="reset" class="secondary">清除筛选</button>
      <button id="exportSession">导出本次 TSV</button>
    </div>
    <div class="stats" id="stats" aria-live="polite"></div>
  </section>

  <section class="panel" aria-label="不熟悉卡片管理">
    <div class="review-grid">
      <button id="studyUnfamiliar" class="secondary">只学习不熟悉</button>
      <button id="showUnfamiliar" class="secondary">只显示不熟悉</button>
      <button id="exportUnfamiliar">导出不熟悉 TSV</button>
      <button id="clearUnfamiliar" class="secondary danger">清空不熟悉</button>
    </div>
    <div class="note">点击卡片右上角的“☆ 不熟悉”即可单独标记；标记会保存在当前浏览器中。只学习不熟悉时，会尊重当前“排序依据”和“学习范围”。</div>
  </section>

  <section class="panel" aria-label="导入 TSV 卡片">
    <div class="import-grid">
      <div class="field">
        <label for="tsvFile">导入 TSV 文件</label>
        <input id="tsvFile" type="file" accept=".tsv,.txt,text/tab-separated-values,text/plain">
      </div>
      <button id="importTSV">导入到当前学习</button>
      <button id="clearImported" class="secondary danger">清空导入卡片</button>
    </div>
    <div class="note">支持 Anki 常见格式：<span class="kbd">正面 TAB 背面</span>；也支持 <span class="kbd">单词 TAB 意思 TAB 词性 TAB 词族/例句</span>。导入卡片会保存在当前浏览器里，并可在“学习范围”中选择“导入卡片”。</div>
    <div id="importStatus" class="import-status" aria-live="polite"></div>
  </section>

  <main id="cards" aria-live="polite"><div class="loading">正在加载卡片…</div></main>
</div>

pos_groups":{"名词":["version"],"其他/按语境":["versions"]},"dict":"https://dictionary.cambridge.org/dictionary/english/version","awl_index":558,"sublist":5,"importance_order":298,"unit_order":58,"pdf_word":"version"},{"word":"via","meaning":"通过；经由","head_pos":"介词","family":"","forms":["via"],"pos_groups":{"介词":["via"]},"dict":"https://dictionary.cambridge.org/dictionary/english/via","awl_index":559,"sublist":8,"importance_order":477,"unit_order":57,"pdf_word":"via"},{"word":"violate","meaning":"违反；侵犯；亵渎","head_pos":"动词","family":"violated, violates, violating, violation, violations","forms":["violate","violated","violates","violating","violation","violations"],"pos_groups":{"动词":["violate","violating"],"动词 / 形容词":["violated"],"其他/按语境":["violates","violations"],"名词":["violation"]},"dict":"https://dictionary.cambridge.org/dictionary/english/violate","awl_index":560,"sublist":9,"importance_order":539,"unit_order":59,"pdf_word":"violation"},{"word":"virtual","meaning":"虚拟的；实质上的；几乎的","head_pos":"形容词","family":"virtually","forms":["virtual","virtually"],"pos_groups":{"形容词":["virtual"],"副词 / 名词":["virtually"]},"dict":"https://dictionary.cambridge.org/dictionary/english/virtual","awl_index":561,"sublist":8,"importance_order":478,"unit_order":58,"pdf_word":"virtually"},{"word":"visible","meaning":"可见的；明显的","head_pos":"形容词","family":"visibility, visibly, invisible, invisibility","forms":["visible","visibility","visibly","invisible","invisibility"],"pos_groups":{"形容词":["visible","invisible"],"名词":["visibility","invisibility"],"副词 / 名词":["visibly"]},"dict":"https://dictionary.cambridge.org/dictionary/english/visible","awl_index":562,"sublist":7,"importance_order":419,"unit_order":59,"pdf_word":"visible"},{"word":"vision","meaning":"视力；愿景；想象","head_pos":"名词","family":"visions","forms":["vision","visions"],"pos_groups":{"名词":["vision"],"其他/按语境":["visions"]},"dict":"https://dictionary.cambridge.org/dictionary/english/vision","awl_index":563,"sublist":9,"importance_order":540,"unit_order":60,"pdf_word":"vision"},{"word":"visual","meaning":"视觉的；图像；可视的","head_pos":"名词 / 形容词","family":"visualise, visualised, visualised, visualising, visualisation, visually","forms":["visual","visualise","visualised","visualising","visualisation","visually"],"pos_groups":{"名词 / 形容词":["visual"],"动词":["visualise","visualising"],"动词 / 形容词":["visualised"],"名词":["visualisation"],"副词 / 名词":["visually"]},"dict":"https://dictionary.cambridge.org/dictionary/english/visual","awl_index":564,"sublist":8,"importance_order":480,"unit_order":60,"pdf_word":"visual"},{"word":"volume","meaning":"体积；卷；音量；大量","head_pos":"名词","family":"volumes, vol","forms":["volume","volumes","vol"],"pos_groups":{"名词":["volume"],"其他/按语境":["volumes","vol"]},"dict":"https://dictionary.cambridge.org/dictionary/english/volume","awl_index":565,"sublist":3,"importance_order":180,"unit_order":60,"pdf_word":"volume"},{"word":"voluntary","meaning":"自愿的；志愿的","head_pos":"形容词","family":"voluntarily, volunteer, volunteering, volunteered, volunteers","forms":["voluntary","voluntarily","volunteer","volunteering","volunteered","volunteers"],"pos_groups":{"名词 / 形容词":["voluntary"],"副词 / 名词":["voluntarily"],"名词":["volunteer"],"动词":["volunteering"],"动词 / 形容词":["volunteered"],"其他/按语境":["volunteers"]},"dict":"https://dictionary.cambridge.org/dictionary/english/voluntary","awl_index":566,"sublist":7,"importance_order":420,"unit_order":60,"pdf_word":"voluntary"},{"word":"welfare","meaning":"福利；幸福；福祉","head_pos":"名词","family":"","forms":["welfare"],"pos_groups":{"名词":["welfare"]},"dict":"https://dictionary.cambridge.org/dictionary/english/welfare","awl_index":567,"sublist":5,"importance_order":299,"unit_order":59,"pdf_word":"welfare"},{"word":"whereas","meaning":"然而；鉴于","head_pos":"连词","family":"","forms":["whereas"],"pos_groups":{"连词":["whereas"]},"dict":"https://dictionary.cambridge.org/dictionary/english/whereas","awl_index":568,"sublist":5,"importance_order":300,"unit_order":60,"pdf_word":"whereas"},{"word":"whereby","meaning":"凭借；借以；由此","head_pos":"副词/连词","family":"","forms":["whereby"],"pos_groups":{"副词/连词":["whereby"]},"dict":"https://dictionary.cambridge.org/dictionary/english/whereby","awl_index":569,"sublist":10,"importance_order":570,"unit_order":30,"pdf_word":"whereby"},{"word":"widespread","meaning":"广泛的；普遍的","head_pos":"形容词","family":"","forms":["widespread"],"pos_groups":{"形容词":["widespread"]},"dict":"https://dictionary.cambridge.org/dictionary/english/widespread","awl_index":570,"sublist":8,"importance_order":479,"unit_order":59,"pdf_word":"widespread"}]</script>
<script>
(() => {
  const BASE_WORDS = JSON.parse(document.getElementById('data').textContent);
  const BASE_TOTAL = BASE_WORDS.length;
  let WORDS = [];
  let total = BASE_TOTAL;

  const cardsEl = document.getElementById('cards');
  const q = document.getElementById('q');
  const letter = document.getElementById('letter');
  const stats = document.getElementById('stats');
  const orderMode = document.getElementById('orderMode');
  const unitFilter = document.getElementById('unitFilter');
  const mode = document.getElementById('mode');
  const frontMode = document.getElementById('frontMode');
  const amount = document.getElementById('amount');
  const startIndex = document.getElementById('startIndex');
  const generateAllBtn = document.getElementById('generateAll');
  const flipAllBtn = document.getElementById('flipAll');
  const reviewFilter = document.getElementById('reviewFilter');
  const studyUnfamiliarBtn = document.getElementById('studyUnfamiliar');
  const showUnfamiliarBtn = document.getElementById('showUnfamiliar');
  const exportUnfamiliarBtn = document.getElementById('exportUnfamiliar');
  const clearUnfamiliarBtn = document.getElementById('clearUnfamiliar');
  const tsvFile = document.getElementById('tsvFile');
  const importTSVBtn = document.getElementById('importTSV');
  const clearImportedBtn = document.getElementById('clearImported');
  const importStatus = document.getElementById('importStatus');
  const totalCountEl = document.getElementById('totalCount');

  const STORAGE_KEY = 'awl_anki_unfamiliar_words_v1';
  const IMPORT_STORAGE_KEY = 'awl_anki_imported_cards_v1';

  const loadUnfamiliar = () => {
    try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); }
    catch { return new Set(); }
  };
  let unfamiliarWords = loadUnfamiliar();
  const saveUnfamiliar = () => localStorage.setItem(STORAGE_KEY, JSON.stringify([...unfamiliarWords]));

  const loadImportedCards = () => {
    try {
      const cards = JSON.parse(localStorage.getItem(IMPORT_STORAGE_KEY) || '[]');
      return Array.isArray(cards) ? cards : [];
    } catch { return []; }
  };
  let importedCards = loadImportedCards();
  const saveImportedCards = () => localStorage.setItem(IMPORT_STORAGE_KEY, JSON.stringify(importedCards));

  let activeCards = [];
  let allFlipped = false;

  const escapeHTML = (value) => String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
  const stripHTML = (value) => String(value ?? '')
    .replace(/<br\s*\/?>(?![^<]*>)/gi, '\n')
    .replace(/<[^>]*>/g, ' ')
    .replace(/&nbsp;/gi, ' ')
    .replace(/&amp;/gi, '&')
    .replace(/&lt;/gi, '<')
    .replace(/&gt;/gi, '>')
    .replace(/&quot;/gi, '"')
    .replace(/&#39;/gi, "'")
    .replace(/\s+\n/g, '\n')
    .replace(/\n\s+/g, '\n')
    .replace(/[ \t]{2,}/g, ' ')
    .trim();
  const importedBackHTML = (raw) => escapeHTML(stripHTML(raw)).replace(/\n/g, '<br>');
  const setImportStatus = (message) => { importStatus.textContent = message || ''; };
  const clamp = (value, min, max, fallback) => {
    const n = Number.parseInt(value, 10);
    if (Number.isNaN(n)) return fallback;
    return Math.min(max, Math.max(min, n));
  };
  const shuffle = (array) => {
    const arr = array.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };
  const sublistName = (item) => item.imported ? '导入' : `S${item.sublist}`;
  const importanceText = (item) => item.imported ? '导入卡片' : `Sublist ${item.sublist} · 单元内 #${item.unit_order} · 总重要性 #${String(item.importance_order).padStart(3,'0')}`;
  const displayWord = (item) => frontMode.value === 'headword' ? item.word : (item.pdf_word || item.word);
  const reviewLabel = (word) => unfamiliarWords.has(word) ? '★ 已标记' : '☆ 不熟悉';
  const posHTML = (groups) => Object.entries(groups || {}).map(([pos, forms]) =>
    `<div><b>${escapeHTML(pos)}：</b>${escapeHTML((forms || []).join('、'))}</div>`
  ).join('');

  const enrichImportedCards = () => importedCards.map((card, index) => ({
    ...card,
    imported: true,
    awl_index: BASE_TOTAL + index + 1,
    sublist: '导入',
    importance_order: 100000 + index + 1,
    unit_order: index + 1,
    pdf_word: card.pdf_word || card.word
  }));

  const rebuildWordBank = () => {
    WORDS = BASE_WORDS.concat(enrichImportedCards());
    total = WORDS.length;
    totalCountEl.textContent = total;
    syncPoolControls(false);
  };

  const currentPool = () => {
    let pool = WORDS.slice();
    const unit = unitFilter.value;
    if (unit === 'imported') pool = pool.filter(item => item.imported);
    else if (unit !== 'all') pool = pool.filter(item => !item.imported && String(item.sublist) === unit);
    if (orderMode.value === 'importance') {
      pool.sort((a, b) => (Number(a.importance_order) || 999999) - (Number(b.importance_order) || 999999) || String(a.word).localeCompare(String(b.word)));
    } else {
      pool.sort((a, b) => String(a.word).localeCompare(String(b.word)) || (Number(a.importance_order) || 999999) - (Number(b.importance_order) || 999999));
    }
    return pool;
  };

  const syncPoolControls = (changeValues = true) => {
    const poolSize = currentPool().length;
    amount.max = Math.max(1, poolSize);
    startIndex.max = Math.max(1, poolSize);
    if (changeValues) {
      if (Number(amount.value) > poolSize || Number(amount.value) < 1) amount.value = Math.max(1, poolSize);
      if (Number(startIndex.value) > poolSize || Number(startIndex.value) < 1) startIndex.value = 1;
    } else {
      if (!amount.value) amount.value = Math.max(1, poolSize);
      if (!startIndex.value) startIndex.value = 1;
    }
    generateAllBtn.textContent = `生成当前范围全部（${poolSize}）`;
    startIndex.disabled = mode.value === 'random';
    startIndex.parentElement.style.opacity = mode.value === 'random' ? .55 : 1;
  };

  const cardHTML = (entry) => {
    const item = entry.item;
    const wordKey = item.word;
    const shown = displayWord(item);
    const forms = (item.forms || []).join(', ');
    const marked = unfamiliarWords.has(wordKey);
    const sourceLabel = item.imported ? '导入' : `AWL #${item.awl_index}`;
    const unitLabel = item.imported ? '导入卡片' : `Sublist ${item.sublist}`;
    const search = [shown, item.word, item.pdf_word, item.meaning, item.head_pos, forms, unitLabel, `S${item.sublist}`].join(' ').toLowerCase();
    const dictBlock = item.dict ? `<div class="dict"><a href="${escapeHTML(item.dict)}" target="_blank" rel="noopener">Cambridge 查词</a></div>` : '';
    const importedBlock = item.imported && item.rawBack ? `<div class="label">导入背面</div><div class="forms">${importedBackHTML(item.rawBack)}</div>` : '';
    const headwordBlock = shown !== item.word ? `<div class="label">AWL 词族核心词</div><div class="forms">${escapeHTML(item.word)}</div>` : '';
    const pdfWordBlock = !item.imported ? `<div class="label">PDF 高频词形</div><div class="forms">${escapeHTML(item.pdf_word || item.word)}</div>` : '';
    return `<article class="card ${marked ? 'unfamiliar' : ''}" tabindex="0" data-word="${escapeHTML(wordKey)}" data-letter="${escapeHTML((shown[0] || '#').toUpperCase())}" data-search="${escapeHTML(search)}">
      <div class="inner">
        <section class="face front" aria-label="卡片正面">
          <button class="review-toggle" type="button" aria-label="标记不熟悉">${reviewLabel(wordKey)}</button>
          <div class="meta"><span>${sourceLabel}</span><span class="unit">${escapeHTML(unitLabel)}</span><span>本次 #${entry.sessionIndex}</span></div>
          <div class="word">${escapeHTML(shown)}</div>
          <div class="chips"><span>${escapeHTML(item.head_pos)}</span><span class="important">${escapeHTML(sublistName(item))}</span><span>点击翻面</span></div>
        </section>
        <section class="face back" aria-label="卡片背面">
          <button class="review-toggle" type="button" aria-label="取消或标记不熟悉">${reviewLabel(wordKey)}</button>
          <div class="meta"><span>${sourceLabel}</span><span class="unit">${escapeHTML(unitLabel)}</span><span>本次 #${entry.sessionIndex}</span></div>
          <div class="smallword">${escapeHTML(shown)}</div>
          <div class="label">中文意思</div>
          <div class="meaning">${escapeHTML(item.meaning)}</div>
          <div class="label">单元重要性</div>
          <div class="forms">${escapeHTML(importanceText(item))}</div>
          ${pdfWordBlock}
          ${headwordBlock}
          <div class="label">主要词性</div>
          <div class="forms">${escapeHTML(item.head_pos)}</div>
          <div class="label">不同词性 / 词族形式</div>
          <div class="forms">${posHTML(item.pos_groups)}</div>
          ${importedBlock}
          ${dictBlock}
          <div class="hint">再次点击卡片返回正面</div>
        </section>
      </div>
    </article>`;
  };

  const updateLetters = () => {
    const current = letter.value;
    const letters = [...new Set(activeCards.map(entry => String(displayWord(entry.item)[0] || '#').toUpperCase()))].sort();
    letter.innerHTML = '<option value="">全部首字母</option>' + letters.map(l => `<option value="${escapeHTML(l)}">${escapeHTML(l)}</option>`).join('');
    if (letters.includes(current)) letter.value = current;
  };

  const render = () => {
    allFlipped = false;
    flipAllBtn.textContent = '翻开全部';
    cardsEl.innerHTML = activeCards.map(cardHTML).join('') + '<div id="empty" class="empty hidden">没有找到匹配的卡片。请清空搜索或换一个筛选条件。</div>';
    updateLetters();
    filterCards();
  };

  const filterCards = () => {
    const text = q.value.trim().toLowerCase();
    const l = letter.value;
    const review = reviewFilter.value;
    const cardNodes = [...cardsEl.querySelectorAll('.card')];
    let count = 0;
    cardNodes.forEach(card => {
      const marked = unfamiliarWords.has(card.dataset.word);
      const reviewOk = review === 'all' || (review === 'unfamiliar' && marked) || (review === 'familiar' && !marked);
      const ok = reviewOk && (!l || card.dataset.letter === l) && (!text || card.dataset.search.includes(text));
      card.classList.toggle('hidden', !ok);
      if (ok) count += 1;
    });
    const emptyNow = document.getElementById('empty');
    if (emptyNow) emptyNow.classList.toggle('hidden', count !== 0);
    const poolSize = currentPool().length;
    const modeName = mode.value === 'random' ? '乱序' : '顺序';
    const orderName = orderMode.value === 'importance' ? '单元重要性' : '字母顺序';
    const rangeName = unitFilter.options[unitFilter.selectedIndex]?.text || '全部';
    const sessionMarked = activeCards.filter(entry => unfamiliarWords.has(entry.item.word)).length;
    stats.innerHTML = `<span class="badge">显示 ${count} / 本次 ${activeCards.length} 张</span><span class="badge orange">排序：${orderName}</span><span class="badge">范围：${escapeHTML(rangeName)}</span><span class="badge">生成：${modeName}</span><span class="badge green">不熟悉：本次 ${sessionMarked} / 全部 ${unfamiliarWords.size}</span><span class="badge">当前范围 ${poolSize} 张</span><span class="badge">导入 ${importedCards.length} 张</span>`;
  };

  const generateSession = () => {
    const pool = currentPool();
    if (!pool.length) {
      activeCards = [];
      render();
      alert('当前学习范围没有卡片。');
      return;
    }
    const n = clamp(amount.value, 1, pool.length, pool.length);
    const start = clamp(startIndex.value, 1, pool.length, 1);
    amount.value = n;
    startIndex.value = start;
    q.value = '';
    letter.value = '';
    reviewFilter.value = 'all';
    const chosen = mode.value === 'random'
      ? shuffle(pool).slice(0, n)
      : Array.from({length:n}, (_, i) => pool[(start - 1 + i) % pool.length]);
    activeCards = chosen.map((item, i) => ({ item, sessionIndex:i + 1 }));
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  };

  const exportEntries = (entries, filename) => {
    const TAB = String.fromCharCode(9);
    const NL = String.fromCharCode(10);
    if (!entries.length) { alert('没有可导出的卡片。'); return; }
    const lines = entries.map(entry => {
      const item = entry.item;
      const groups = Object.entries(item.pos_groups || {}).map(([pos, forms]) => `${pos}：${(forms || []).join('、')}`).join('<br>');
      const front = displayWord(item);
      const mark = unfamiliarWords.has(item.word) ? '<br>熟悉程度：不熟悉' : '';
      const unit = item.imported ? '导入卡片' : `Sublist ${item.sublist}；总重要性 #${String(item.importance_order).padStart(3,'0')}；PDF 高频词形：${item.pdf_word || item.word}；AWL 词族核心词：${item.word}`;
      const baseBack = item.imported && item.rawBack ? item.rawBack : `意思：${item.meaning}<br>单元重要性：${unit}<br>主要词性：${item.head_pos}<br>不同词性/词族：<br>${groups}${item.dict ? `<br><a href="${item.dict}">Cambridge</a>` : ''}`;
      const back = `${baseBack}${mark}`;
      return [front, back].map(v => String(v).split(TAB).join(' ').split(NL).join(' ')).join(TAB);
    }).join(NL);
    const blob = new Blob([lines], {type:'text/tab-separated-values;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    const href = a.href;
    a.remove();
    URL.revokeObjectURL(href);
  };
  const exportTSV = () => exportEntries(activeCards, `awl_anki_session_${orderMode.value}_${mode.value}_${activeCards.length}.tsv`);

  const unfamiliarEntriesAll = () => WORDS
    .filter(item => unfamiliarWords.has(item.word))
    .sort((a,b) => (Number(a.importance_order)||999999) - (Number(b.importance_order)||999999))
    .map((item, i) => ({item, sessionIndex:i + 1}));
  const exportUnfamiliarTSV = () => exportEntries(unfamiliarEntriesAll(), `awl_anki_unfamiliar_${unfamiliarWords.size}.tsv`);

  const toggleUnfamiliar = (word) => {
    if (unfamiliarWords.has(word)) unfamiliarWords.delete(word);
    else unfamiliarWords.add(word);
    saveUnfamiliar();
    [...cardsEl.querySelectorAll('.card')].filter(card => card.dataset.word === word).forEach(card => {
      const marked = unfamiliarWords.has(word);
      card.classList.toggle('unfamiliar', marked);
      card.querySelectorAll('.review-toggle').forEach(btn => { btn.textContent = reviewLabel(word); });
    });
    filterCards();
  };

  const studyUnfamiliar = () => {
    let entries = currentPool().filter(item => unfamiliarWords.has(item.word));
    if (!entries.length) {
      alert('当前范围内还没有标记“不熟悉”的卡片。先点击卡片右上角的“☆ 不熟悉”来添加。');
      return;
    }
    if (mode.value === 'random') entries = shuffle(entries);
    activeCards = entries.map((item, i) => ({item, sessionIndex:i + 1}));
    amount.value = activeCards.length;
    startIndex.value = 1;
    q.value = '';
    letter.value = '';
    reviewFilter.value = 'all';
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  };

  const clearUnfamiliar = () => {
    if (!unfamiliarWords.size) return;
    if (!confirm(`确定清空已标记的 ${unfamiliarWords.size} 张“不熟悉”卡片吗？`)) return;
    unfamiliarWords = new Set();
    saveUnfamiliar();
    [...cardsEl.querySelectorAll('.card')].forEach(card => {
      card.classList.remove('unfamiliar');
      card.querySelectorAll('.review-toggle').forEach(btn => { btn.textContent = '☆ 不熟悉'; });
    });
    filterCards();
  };

  const parseTSV = (text) => {
    const rows = String(text || '').replace(/^\uFEFF/, '').split(/\r?\n/);
    const imported = [];
    rows.forEach((row, index) => {
      if (!row.trim() || row.trim().startsWith('#')) return;
      const cols = row.split('\t').map(col => col.trim());
      const word = stripHTML(cols[0] || '').trim();
      if (!word) return;
      const rawBack = cols.length > 1 ? cols.slice(1).join('\t') : '';
      let meaning = '';
      let headPos = '导入卡片';
      let forms = [word];
      let posGroups = {'导入背面':[stripHTML(rawBack) || '无背面内容']};
      if (cols.length >= 4) {
        meaning = stripHTML(cols[1]) || '未填写意思';
        headPos = stripHTML(cols[2]) || '导入卡片';
        forms = stripHTML(cols[3]).split(/[，,、;；]/).map(x => x.trim()).filter(Boolean);
        if (!forms.includes(word)) forms.unshift(word);
        posGroups = {[headPos]: forms};
      } else {
        const plainBack = stripHTML(rawBack);
        meaning = plainBack ? plainBack.slice(0, 120) : '未填写背面内容';
      }
      imported.push({
        word,
        meaning,
        head_pos: headPos,
        family: forms.join(', '),
        forms,
        pos_groups: posGroups,
        dict: /^[A-Za-z][A-Za-z -]*$/.test(word) ? `https://dictionary.cambridge.org/dictionary/english/${encodeURIComponent(word.toLowerCase().replace(/\s+/g, '-'))}` : '',
        imported: true,
        rawBack: rawBack || meaning,
        importRow: index + 1,
        pdf_word: word
      });
    });
    return imported;
  };

  const importTSVText = (text, filename = 'TSV 文件') => {
    const newCards = parseTSV(text);
    if (!newCards.length) {
      setImportStatus(`没有从 ${filename} 读取到可用卡片。请确认每行至少包含“正面<TAB>背面”。`);
      return;
    }
    importedCards = importedCards.concat(newCards);
    saveImportedCards();
    rebuildWordBank();
    unitFilter.value = 'imported';
    orderMode.value = 'importance';
    mode.value = 'sequential';
    activeCards = enrichImportedCards().slice(-newCards.length).map((item, i) => ({ item, sessionIndex:i + 1 }));
    amount.value = activeCards.length;
    startIndex.value = 1;
    q.value = '';
    letter.value = '';
    reviewFilter.value = 'all';
    render();
    setImportStatus(`已从 ${filename} 导入 ${newCards.length} 张卡片。当前词库共 ${total} 张，其中导入 ${importedCards.length} 张。`);
    window.scrollTo({top:0, behavior:'smooth'});
  };

  const importSelectedFile = () => {
    const file = tsvFile.files && tsvFile.files[0];
    if (!file) { setImportStatus('请先选择一个 .tsv 或 .txt 文件。'); return; }
    const reader = new FileReader();
    reader.onload = () => importTSVText(reader.result, file.name);
    reader.onerror = () => setImportStatus('文件读取失败，请换一个 TSV 文件再试。');
    reader.readAsText(file, 'utf-8');
  };

  const clearImported = () => {
    if (!importedCards.length) { setImportStatus('当前没有导入卡片。'); return; }
    if (!confirm(`确定清空已导入的 ${importedCards.length} 张卡片吗？内置 AWL 卡片不会被删除。`)) return;
    importedCards = [];
    saveImportedCards();
    unitFilter.value = 'all';
    rebuildWordBank();
    amount.value = BASE_TOTAL;
    startIndex.value = 1;
    generateSession();
    setImportStatus('已清空导入卡片，当前只保留内置 AWL 词表。');
  };

  cardsEl.addEventListener('click', (event) => {
    const reviewBtn = event.target.closest('.review-toggle');
    if (reviewBtn) {
      const card = reviewBtn.closest('.card');
      if (card) toggleUnfamiliar(card.dataset.word);
      return;
    }
    if (event.target.closest('a,button,input,select')) return;
    const card = event.target.closest('.card');
    if (card) card.classList.toggle('flipped');
  });
  cardsEl.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    const card = event.target.closest('.card');
    if (!card) return;
    event.preventDefault();
    card.classList.toggle('flipped');
  });

  document.getElementById('generate').addEventListener('click', generateSession);
  generateAllBtn.addEventListener('click', () => {
    const poolSize = currentPool().length;
    amount.value = Math.max(1, poolSize);
    startIndex.value = 1;
    generateSession();
  });
  document.getElementById('exportSession').addEventListener('click', exportTSV);
  studyUnfamiliarBtn.addEventListener('click', studyUnfamiliar);
  showUnfamiliarBtn.addEventListener('click', () => { reviewFilter.value = 'unfamiliar'; filterCards(); });
  exportUnfamiliarBtn.addEventListener('click', exportUnfamiliarTSV);
  clearUnfamiliarBtn.addEventListener('click', clearUnfamiliar);
  importTSVBtn.addEventListener('click', importSelectedFile);
  clearImportedBtn.addEventListener('click', clearImported);
  document.getElementById('reset').addEventListener('click', () => { q.value = ''; letter.value = ''; reviewFilter.value = 'all'; filterCards(); });
  flipAllBtn.addEventListener('click', () => {
    allFlipped = !allFlipped;
    [...cardsEl.querySelectorAll('.card:not(.hidden)')].forEach(card => card.classList.toggle('flipped', allFlipped));
    flipAllBtn.textContent = allFlipped ? '合上全部' : '翻开全部';
  });
  [orderMode, unitFilter, mode].forEach(el => el.addEventListener('change', () => { syncPoolControls(true); }));
  frontMode.addEventListener('change', render);
  q.addEventListener('input', filterCards);
  letter.addEventListener('change', filterCards);
  reviewFilter.addEventListener('change', filterCards);
  amount.addEventListener('keydown', (event) => { if (event.key === 'Enter') generateSession(); });
  startIndex.addEventListener('keydown', (event) => { if (event.key === 'Enter') generateSession(); });

  rebuildWordBank();
  if (importedCards.length) setImportStatus(`已载入浏览器中保存的 ${importedCards.length} 张导入卡片。`);
  activeCards = currentPool().map((item, i) => ({ item, sessionIndex:i + 1 }));
  amount.value = Math.min(570, activeCards.length);
  startIndex.value = 1;
  render();
})();
</script>
</body>
</html>
